<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký Shipper | QNH Delivery</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"><link href="/css/auth.css" rel="stylesheet"></head><body class="auth-page"><main class="card auth-card"><div class="auth-head"><div class="auth-icon"><i class="bi bi-person-plus"></i></div><h1 class="h4 fw-bold">Đăng ký Shipper</h1></div><div class="auth-body"><div id="formAlert"></div><form id="registerForm" novalidate><label class="form-label required">Họ tên</label><input name="fullName" class="form-control" required><label class="form-label required mt-3">Email</label><input type="email" name="email" class="form-control" required><label class="form-label required mt-3">Số điện thoại</label><input name="phone" pattern="(0|\+84)(3|5|7|8|9)[0-9]{8}" class="form-control" required><label class="form-label required mt-3">Mật khẩu</label><input type="password" name="password" minlength="8" class="form-control" required><label class="form-label required mt-3">Xác nhận mật khẩu</label><input type="password" name="confirmPassword" minlength="8" class="form-control" required><button class="btn btn-primary w-100 mt-4" type="submit">Đăng ký Shipper</button></form><div class="auth-footer mt-4">Đã có tài khoản? <a href="/auth/login.html">Đăng nhập</a></div></div></main><div id="toastRoot" class="toast-container position-fixed top-0 end-0 p-3"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/common.js"></script><script src="/js/auth.js"></script></body></html>
